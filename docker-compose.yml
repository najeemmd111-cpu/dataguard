services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dataguard
      POSTGRES_PASSWORD: dataguard
      POSTGRES_DB: dataguard
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataguard -d dataguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  seed:
    build: ./db
    environment:
      DATABASE_URL: postgresql://dataguard:dataguard@postgres:5432/dataguard
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rules-engine:
    build: ./rules-engine
    environment:
      DATABASE_URL: postgresql://dataguard:dataguard@postgres:5432/dataguard
      CONTRACTS_DIR: /contracts
      SCHEDULER_ENABLED: "true"
      # Phase 4: alerts go to the n8n workflow (start it with: docker compose --profile alerts up -d)
      FAILURE_WEBHOOK_URL: ${FAILURE_WEBHOOK_URL:-http://n8n:5678/webhook/dataguard-failure}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:5173}
    volumes:
      - ./contracts:/contracts:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: on-failure:5     # safety net if the database is still not reachable after the startup retries

  # Phase 3 knowledge search. Not started by `docker compose up`; run it on demand:
  #   docker compose run --rm agent ingest
  #   docker compose run --rm agent search "why are orders stale?"
  #   docker compose run --rm agent evaluate
  #   docker compose run --rm agent investigate orders_fresh   (needs Ollama running on your machine)
  agent:
    build: ./agent
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://dataguard:dataguard@postgres:5432/dataguard
      DOCS_DIR: /docs
      OLLAMA_URL: http://host.docker.internal:11434    # Ollama runs on the host, outside Docker
      DG_LLM_MODEL: ${DG_LLM_MODEL:-qwen2.5:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"            # makes the name work on Linux too
    volumes:
      - ./docs:/docs:ro
      - ./agent/eval:/app/eval          # evaluation results are written back here
      - models:/models                  # downloaded models are kept between runs
    depends_on:
      postgres:
        condition: service_healthy

  # Phase 4: alerting. Not started by a plain `docker compose up`; start it with:
  #   docker compose --profile alerts up -d
  # n8n: http://localhost:5678   Mailpit (fake inbox): http://localhost:8025
  n8n:
    image: n8nio/n8n:2.45.7
    profiles: ["alerts"]
    ports:
      - "5678:5678"
    environment:
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_SECURE_COOKIE: "false"                 # plain http on localhost
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"      # the workflow reads the settings below
      GENERIC_TIMEZONE: ${TZ:-Europe/Paris}
      MAILPIT_URL: http://mailpit:8025
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-data-team@example.com}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}  # optional: new critical failures also go to Slack
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    # Import (or update) the DataGuard workflow and publish it on every start, then run n8n.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        n8n import:workflow --input=/workflows/dataguard-alerts.json &&
        n8n publish:workflow --id=DgAlerts00000001 &&
        exec n8n start
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: ["alerts"]
    ports:
      - "8025:8025"     # web inbox and HTTP API
      - "1025:1025"     # SMTP, if you prefer n8n's Send Email node

volumes:
  pgdata:
  models:
  n8n_data:

# The MCP server is not a compose service: an MCP client (Claude Desktop,
# Claude Code, MCP Inspector) starts it over stdio. See mcp-server/README.md.
