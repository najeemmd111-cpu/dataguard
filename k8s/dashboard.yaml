apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: dataguard
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30880        # published on localhost:8880 by kind-config.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: dataguard
spec:
  replicas: 2                # static files only, so it scales freely
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101       # nginx in nginx-unprivileged
      containers:
        - name: dashboard
          image: dataguard/dashboard:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
