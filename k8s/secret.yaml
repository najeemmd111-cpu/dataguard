# Local development credentials only. For a real cluster, create this Secret from a secret store
# (for example External Secrets or Sealed Secrets) instead of committing it.
apiVersion: v1
kind: Secret
metadata:
  name: db
  namespace: dataguard
type: Opaque
stringData:
  POSTGRES_PASSWORD: dataguard
  DATABASE_URL: postgresql://dataguard:dataguard@postgres:5432/dataguard
