# Loads the sample data once. seed.py skips the load if data is already there,
# so deploy.sh can safely re-create this Job on every deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: dataguard
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-postgres
          image: pgvector/pgvector:pg16
          command: ["sh", "-c", "until pg_isready -h postgres -U dataguard; do echo waiting for postgres; sleep 2; done"]
          securityContext:
            runAsUser: 999          # the postgres user in the image
            allowPrivilegeEscalation: false
      containers:
        - name: seed
          image: dataguard/seed:dev
          imagePullPolicy: Never     # built locally and loaded into kind
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
