apiVersion: v1
kind: Service
metadata:
  name: rules-engine
  namespace: dataguard
spec:
  type: NodePort
  selector:
    app: rules-engine
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30800        # published on localhost:8800 by kind-config.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rules-engine
  namespace: dataguard
spec:
  # One replica on purpose: the check scheduler runs inside the engine, so two
  # replicas would run every check twice. Scaling out would mean moving the
  # scheduler to a CronJob first.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rules-engine
  template:
    metadata:
      labels:
        app: rules-engine
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: rules-engine
          image: dataguard/rules-engine:dev
          imagePullPolicy: Never   # built locally and loaded into kind
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db
                  key: DATABASE_URL
            - name: CONTRACTS_DIR
              value: /contracts
            - name: SCHEDULER_ENABLED
              value: "true"
            - name: DASHBOARD_URL
              value: http://localhost:8880
            - name: FAILURE_WEBHOOK_URL   # no n8n in the cluster: alerts are switched off
              value: ""
          volumeMounts:
            - name: contracts
              mountPath: /contracts
              readOnly: true
          # Ready = the database answers (GET /health queries it).
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Alive = the process accepts connections. Not /health: a database outage
          # should not make Kubernetes restart the engine over and over.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: contracts
          configMap:
            name: contracts
