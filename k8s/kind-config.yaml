# A local Kubernetes cluster inside Docker: kind create cluster --name dataguard --config k8s/kind-config.yaml
# NodePorts are published on your Mac, next to (not clashing with) the Docker Compose ports:
#   rules engine  http://localhost:8800   (Compose uses 8000)
#   dashboard     http://localhost:8880   (the Vite dev server uses 5173)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30800
        hostPort: 8800
        listenAddress: "127.0.0.1"
      - containerPort: 30880
        hostPort: 8880
        listenAddress: "127.0.0.1"
