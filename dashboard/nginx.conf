# Serves the built dashboard and forwards /api/* to the rules engine,
# the same way the Vite dev server does in development.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        # "rules-engine" is the Kubernetes Service name. The trailing slash strips the /api prefix.
        proxy_pass http://rules-engine:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Built files have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths such as /datasets/orders load index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
