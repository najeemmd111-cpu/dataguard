name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rules-engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dataguard
          POSTGRES_PASSWORD: dataguard
          POSTGRES_DB: dataguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataguard" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://dataguard:dataguard@localhost:5432/dataguard
    defaults:
      run:
        working-directory: rules-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rules-engine/requirements-dev.txt
      - run: pip install -r requirements-dev.txt -r ../db/requirements.txt
      - run: ruff check .
      - run: pytest -v

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

