name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rules-engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dataguard
          POSTGRES_PASSWORD: dataguard
          POSTGRES_DB: dataguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataguard" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://dataguard:dataguard@localhost:5432/dataguard
    defaults:
      run:
        working-directory: rules-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rules-engine/requirements-dev.txt
      - run: pip install -r requirements-dev.txt -r ../db/requirements.txt
      - run: ruff check .
      - run: pytest -v

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx vitest run
      - run: npm run build          # includes the TypeScript type check

  e2e:
    # Whole stack: Postgres + seed + rules engine in Docker, dashboard from Vite,
    # then Playwright drives a real browser through it.
    needs: [rules-engine, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres, seed data and the rules engine
        run: docker compose up -d --build
      - name: Wait for the rules engine
        run: timeout 180 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run Playwright tests (functional + axe accessibility)
        run: npx playwright test
        working-directory: e2e

      - name: Upload the Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - name: Show service logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail 200
